[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "jellyfin-msx"
version = "0.1.0"
description = "Authenticated Jellyfin client for Media Station X"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<0.29", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "cryptography>=50.0.2,<51", "segno>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx2>=2.16,<3", "pillow>=12,<14", "zxing-cpp>=3,<4"]

[dependency-groups]
# Build without isolation after syncing this exact, transitively locked group.
build = ["hatchling==1.33.0"]

[tool.hatch.build]
include = ["src/jellyfin_msx/**/*.py", "src/jellyfin_msx/templates/*.html", "src/jellyfin_msx/templates/*.js"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
