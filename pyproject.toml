[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jellyfin-msx"
version = "0.1.0"
description = "Authenticated Jellyfin client for Media Station X"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<0.29", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jellyfin_msx"]

[tool.hatch.build.targets.wheel.force-include]
"src/jellyfin_msx/templates/pair.html" = "jellyfin_msx/templates/pair.html"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
