<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pair your Jellyfin TV</title>
  <link rel="stylesheet" href="/pair.css">
</head>
<body>
  <main>
    <h1>Pair your TV</h1>
    <p>{{instructions}}</p>

      {{fields}}

    <p>{{help}}</p>
  </main>
</body>
</html>
