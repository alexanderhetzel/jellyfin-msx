<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{heading}} · Jellyfin MSX</title>
  <link rel="stylesheet" href="/pair.css">
</head>
<body>
  <main>
    <p class="brand">Jellyfin MSX</p>
    <p class="step">{{step}}</p>
    <h1>{{heading}}</h1>
    <p>{{instructions}}</p>
    <p class="server">Jellyfin server: {{server}}</p>
    <p class="message" role="status">{{message}}</p>
    <form action="/pair" method="post">
      <input type="hidden" name="csrf" value="{{csrf}}">
      {{fields}}
    </form>
    <p class="help">{{help}}</p>
  </main>
</body>
</html>
