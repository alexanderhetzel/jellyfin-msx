name: isolated Jellyfin contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jellyfin-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONTRACT_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["12.0", "12.1", "12.2", "12.3", "12.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.txt
          uv sync --frozen --only-group build
          uv sync --frozen --extra dev --group build --no-build-isolation
      - name: Real isolated API observations (root and base path)
        run: uv run --no-sync python -m tools.jellyfin_contract --version '${{ matrix.version }}'
      - name: Cleanup this job's disposable resources after cancellation or failure
        if: always()
        run: |
          docker ps -aq --filter "label=msx-contract.owner=$CONTRACT_OWNER" | xargs -r docker rm --force --volumes
          docker network ls -q --filter "label=msx-contract.owner=$CONTRACT_OWNER" | xargs -r docker network rm
          test -z "$(docker ps -aq --filter "label=msx-contract.owner=$CONTRACT_OWNER")"
          test -z "$(docker network ls -q --filter "label=msx-contract.owner=$CONTRACT_OWNER")"
