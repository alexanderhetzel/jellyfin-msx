name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.txt
          uv lock --check
          uv sync --frozen --only-group build
          uv sync --frozen --extra dev --group build --no-build-isolation
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -W error
      - name: Synthetic HTTP contract smoke (no external runtime)
        run: uv run --no-sync python -m tools.synthetic_check
      - name: Verify wheel exclusion and reviewed manifest
        run: |
          python -m tools.package_check seed
          uv build --python .venv/bin/python --wheel --no-build-isolation --offline
          python -m tools.package_check wheel dist/jellyfin_msx-0.1.0-py3-none-any.whl
      - name: Smoke-test installed wheel with locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/runtime.txt"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$GITHUB_WORKSPACE/tools/dependency_smoke.py"
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose --env-file .env.example config --quiet
      - name: Verify filtered Docker context with synthetic exclusion canaries
        run: |
          python -m tools.package_check seed
          printf 'FROM scratch\nCOPY . /\n' | docker build --file - --output "type=local,dest=$RUNNER_TEMP/build-context" .
          python -m tools.package_check context "$RUNNER_TEMP/build-context"
      - run: docker build --tag jellyfin-msx:test .
      - name: Validate HTTPS proxy configuration
        run: |
          proxy_image=$(docker compose --env-file .env.example config --format json | python -c 'import json,sys; print(json.load(sys.stdin)["services"]["https"]["image"])')
          docker run --rm -e MSX_DOMAIN=tv.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" "$proxy_image" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate
      - name: Inspect final container filesystem and runtime dependencies
        run: |
          test "$(docker image inspect jellyfin-msx:test --format '{{.Config.User}}')" = 10001
          docker create --name package-audit jellyfin-msx:test
          docker export --output "$RUNNER_TEMP/portal.tar" package-audit
          python -m tools.package_check image "$RUNNER_TEMP/portal.tar"
          docker rm package-audit
          docker run --rm --entrypoint pip jellyfin-msx:test check
          docker run --rm -v "$PWD/tools/dependency_smoke.py:/dependency_smoke.py:ro" --entrypoint python jellyfin-msx:test /dependency_smoke.py
      - name: Smoke-test the packaged application
        run: |
          docker run -d --name portal -p 127.0.0.1:8090:8090 -e MSX_PUBLIC_URL=https://portal.invalid -e JELLYFIN_URL=https://jellyfin.invalid jellyfin-msx:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/healthz; then
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/msx/start.json
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/pair
              exit 0
            fi
            sleep 1
          done
          docker logs portal
          exit 1
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner'
