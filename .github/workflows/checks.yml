name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.8
          uv sync --frozen --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - run: uv build --wheel
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --tag jellyfin-msx:test .
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e MSX_DOMAIN=tv.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate
      - name: Smoke-test the packaged application
        run: |
          docker run -d --name portal -p 127.0.0.1:8090:8090 -e MSX_PUBLIC_URL=https://portal.invalid -e JELLYFIN_URL=https://jellyfin.invalid jellyfin-msx:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8090/healthz; then
              curl --fail http://127.0.0.1:8090/msx/start.json
              curl --fail http://127.0.0.1:8090/pair
              exit 0
            fi
            sleep 1
          done
          docker logs portal
          exit 1
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner'
