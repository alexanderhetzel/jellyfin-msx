name: Feature or engineering task
description: Propose one outcome with acceptance criteria and verification.
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and context
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes a fresh contributor can verify independently.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and dependencies
      description: Include runnable checks, required device evidence and related issues.
    validations:
      required: true
