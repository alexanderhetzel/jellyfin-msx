<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MSX synthetic lifecycle probe</title>
  <script>
    if (window.parent !== window) { document.documentElement.style.visibility = "hidden"; }
  </script>
</head>
<body>
  <pre id="records">Waiting for public API readiness.</pre>
  <script src="https://msx.benzac.de/js/tvx-plugin.min.js"></script>
  <script>
    // Independently authored, synthetic-only research. No backend or credential use.
    TVXPluginTools.onReady(function () {
      var records = [], sequence = 0, started = Date.now(), pending = false;
      var media = "https://raw.githack.com/alexanderhetzel/jellyfin-msx/998bc0829b2df06db568443803a6fb4533e23f40/tests/fixtures/msx-public/synthetic.mp4";
      var events = ["video:load", "video:play", "video:pause", "video:stop", "video:seek",
        "video:restart", "video:speed", "app:suspend", "app:resume", "app:sleep",
        "app:awake", "app:connect", "app:disconnect"];

      function numbers(input) {
        var result = {};
        ["state", "position", "duration", "speed"].forEach(function (key) {
          var value = input && input[key];
          if (typeof value === "number" && isFinite(value) && Math.abs(value) <= 864000) {
            result[key] = Math.round(value * 1000) / 1000;
          }
        });
        if (input && typeof input.ended === "boolean") { result.ended = input.ended; }
        return result;
      }
      function record(kind, name, data, target) {
        var row = {seq: ++sequence, ms: Date.now() - started, kind: kind, name: name, data: numbers(data)};
        if (typeof target === "number" && isFinite(target) && target >= 0 && target <= 864000) {
          row.target = Math.round(target * 1000) / 1000;
        }
        records.push(row);
        if (records.length > 240) { records.shift(); }
        document.getElementById("records").textContent = JSON.stringify(records);
        console.log("MSX17 " + JSON.stringify(row));
      }
      function page() {
        return {type: "list", cache: false, headline: "Synthetic lifecycle research - public callbacks",
          template: {type: "default", layout: "0,0,12,1"}, items: [
            {label: "Play synthetic 30-second clip", action: "video:" + media},
            {label: "Read received events and snapshots", action: "content:request:interaction:records"},
            {label: "Open missing-media scenario", action: "content:data", data: {
              headline: "Missing synthetic media - separate playlist",
              template: {type: "default", layout: "0,0,12,1"},
              items: [{label: "Play deliberately missing synthetic media", action: "video:" + media + ".missing"}]
            }},
            {label: "Exit probe content", action: "back"}
          ]};
      }
      TVXInteractionPlugin.setupHandler({
        init: function () {},
        ready: function () {
          record("probe", "ready");
          var interval = setInterval(function () {
            if (Date.now() - started > 600000) { clearInterval(interval); record("probe", "sampling-finished"); return; }
            if (pending) { return; }
            pending = true;
            var active = true;
            var timeout = setTimeout(function () {
              active = false; pending = false; record("probe", "snapshot-timeout");
            }, 5000);
            TVXInteractionPlugin.requestData("video", function (result) {
              if (!active) { return; }
              active = false; clearTimeout(timeout); pending = false;
              record("snapshot", "video", result && result.video && result.video.data);
            });
          }, 2000);
        },
        handleEvent: function (event) {
          if (event && events.indexOf(event.event) >= 0) {
            record("event", event.event, event.data, event.position);
          }
        },
        handleRequest: function (id, data, callback) {
          if (id === "records") {
            callback({type: "list", cache: false, headline: "Received callbacks (event) / requested samples (snapshot)",
              template: {type: "default", layout: "0,0,12,1"},
              items: records.slice(-18).map(function (row) {
                var value = row.data;
                return {label: "#" + row.seq + " " + row.kind + " " + row.name +
                  " @" + row.ms + "ms | state=" + value.state + " pos=" + value.position +
                  " dur=" + value.duration + " ended=" + value.ended +
                  (row.target === undefined ? "" : " target=" + row.target),
                  action: "info:Sanitized synthetic record; commands do not prove decoding."};
              })});
          } else { callback(id === "init" ? page() : null); }
        }
      });
      TVXInteractionPlugin.init();
    });
  </script>
</body>
</html>
